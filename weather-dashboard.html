<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .search-section {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .search-box {
            display: flex;
            gap: 10px;
            background: white;
            padding: 10px;
            border-radius: 50px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            flex: 1;
            min-width: 250px;
            max-width: 400px;
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            padding: 10px 15px;
            font-size: 1rem;
            background: transparent;
        }

        .search-box input::placeholder {
            color: #999;
        }

        .search-box button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .search-box button:hover {
            background: #764ba2;
        }

        .weather-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .weather-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .weather-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .weather-card.main-card {
            grid-column: span 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .city-name {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .temperature-display {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
        }

        .temp-value {
            font-size: 3.5rem;
            font-weight: bold;
        }

        .weather-icon {
            font-size: 4rem;
        }

        .weather-description {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 20px;
            text-transform: capitalize;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .detail {
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            text-align: center;
        }

        .detail-label {
            font-size: 0.9rem;
            opacity: 0.8;
            display: block;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .weather-card.main-card .detail {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .weather-card:not(.main-card) {
            border: 2px solid #f0f0f0;
        }

        .weather-card:not(.main-card) .detail {
            background: #f5f5f5;
        }

        .forecast-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .forecast-section h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #333;
        }

        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
        }

        .forecast-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s;
        }

        .forecast-card:hover {
            transform: scale(1.05);
        }

        .forecast-day {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .forecast-icon {
            font-size: 2.5rem;
            margin: 10px 0;
        }

        .forecast-temp {
            font-size: 1.1rem;
            margin: 10px 0;
        }

        .forecast-temp-min {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .error-message {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            padding: 40px;
        }

        .loader {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .remove-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 15px;
            width: 100%;
            transition: background 0.3s;
        }

        .remove-btn:hover {
            background: #ff5252;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .temp-value {
                font-size: 2.5rem;
            }

            .weather-icon {
                font-size: 3rem;
            }

            .search-box {
                max-width: 100%;
            }

            .weather-grid {
                grid-template-columns: 1fr;
            }

            .forecast-grid {
                grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌤️ Weather Dashboard</h1>
            <p>Get real-time weather information for any location</p>
        </div>

        <div id="error-container"></div>

        <div class="search-section">
            <div class="search-box">
                <input 
                    type="text" 
                    id="cityInput" 
                    placeholder="Enter city name..."
                    autocomplete="off"
                >
                <button onclick="searchWeather()">Search</button>
            </div>
        </div>

        <div id="weather-container"></div>
        <div id="forecast-container"></div>
    </div>

    <script>
        const API_KEY = '85a4e3c55f10d0271d991b11696e85f3'; // OpenWeatherMap free API key
        const CURRENT_WEATHER_URL = 'https://api.openweathermap.org/data/2.5/weather';
        const FORECAST_URL = 'https://api.openweathermap.org/data/2.5/forecast';
        const GEO_URL = 'https://api.openweathermap.org/geo/1.0/direct';

        let currentCities = [];

        // Weather icon mapping
        const weatherIcons = {
            '01d': '☀️', '01n': '🌙',
            '02d': '⛅', '02n': '☁️',
            '03d': '☁️', '03n': '☁️',
            '04d': '☁️', '04n': '☁️',
            '09d': '🌧️', '09n': '🌧️',
            '10d': '🌧️', '10n': '🌧️',
            '11d': '⛈️', '11n': '⛈️',
            '13d': '❄️', '13n': '❄️',
            '50d': '🌫️', '50n': '🌫️'
        };

        function showError(message) {
            const errorContainer = document.getElementById('error-container');
            errorContainer.innerHTML = `<div class="error-message">${message}</div>`;
            setTimeout(() => {
                errorContainer.innerHTML = '';
            }, 5000);
        }

        function showLoading() {
            const container = document.getElementById('weather-container');
            container.innerHTML = '<div class="loading"><div class="loader"></div><p>Loading weather data...</p></div>';
        }

        async function getCoordinates(city) {
            try {
                const response = await fetch(
                    `${GEO_URL}?name=${encodeURIComponent(city)}&limit=1&appid=${API_KEY}`
                );
                const data = await response.json();
                
                if (data.length === 0) {
                    throw new Error('City not found');
                }
                
                return {
                    lat: data[0].lat,
                    lon: data[0].lon,
                    name: data[0].name,
                    country: data[0].country
                };
            } catch (error) {
                throw new Error('Unable to find city. Please check the spelling.');
            }
        }

        async function fetchWeather(city) {
            showLoading();
            
            try {
                const coords = await getCoordinates(city);
                
                const currentResponse = await fetch(
                    `${CURRENT_WEATHER_URL}?lat=${coords.lat}&lon=${coords.lon}&units=metric&appid=${API_KEY}`
                );
                const currentData = await currentResponse.json();
                
                const forecastResponse = await fetch(
                    `${FORECAST_URL}?lat=${coords.lat}&lon=${coords.lon}&units=metric&appid=${API_KEY}`
                );
                const forecastData = await forecastResponse.json();
                
                displayWeather(currentData);
                displayForecast(forecastData);
                addToRecentCities(coords.name, coords.country);
                
            } catch (error) {
                showError(error.message);
                document.getElementById('weather-container').innerHTML = '';
                document.getElementById('forecast-container').innerHTML = '';
            }
        }

        function displayWeather(data) {
            const weatherContainer = document.getElementById('weather-container');
            const temp = Math.round(data.main.temp);
            const feelsLike = Math.round(data.main.feels_like);
            const humidity = data.main.humidity;
            const windSpeed = data.wind.speed;
            const pressure = data.main.pressure;
            const visibility = (data.visibility / 1000).toFixed(1);
            const icon = weatherIcons[data.weather[0].icon] || '🌤️';
            const description = data.weather[0].description;

            weatherContainer.innerHTML = `
                <div class="weather-grid">
                    <div class="weather-card main-card">
                        <div class="city-name">${data.name}, ${data.sys.country}</div>
                        <div class="weather-description">${description}</div>
                        <div class="temperature-display">
                            <div class="weather-icon">${icon}</div>
                            <div>
                                <div class="temp-value">${temp}°C</div>
                                <div style="opacity: 0.9;">Feels like ${feelsLike}°C</div>
                            </div>
                        </div>
                        <div class="weather-details">
                            <div class="detail">
                                <span class="detail-label">Humidity</span>
                                <span class="detail-value">${humidity}%</span>
                            </div>
                            <div class="detail">
                                <span class="detail-label">Wind Speed</span>
                                <span class="detail-value">${windSpeed} m/s</span>
                            </div>
                            <div class="detail">
                                <span class="detail-label">Pressure</span>
                                <span class="detail-value">${pressure} hPa</span>
                            </div>
                            <div class="detail">
                                <span class="detail-label">Visibility</span>
                                <span class="detail-value">${visibility} km</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function displayForecast(data) {
            const forecastContainer = document.getElementById('forecast-container');
            
            // Group forecast by day
            const dailyForecasts = {};
            
            data.list.forEach(item => {
                const date = new Date(item.dt * 1000);
                const day = date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
                
                if (!dailyForecasts[day]) {
                    dailyForecasts[day] = item;
                }
            });

            let forecastHTML = '<div class="forecast-section"><h2>5-Day Forecast</h2><div class="forecast-grid">';
            
            Object.entries(dailyForecasts).slice(0, 5).forEach(([day, data]) => {
                const icon = weatherIcons[data.weather[0].icon] || '🌤️';
                const maxTemp = Math.round(data.main.temp_max);
                const minTemp = Math.round(data.main.temp_min);
                
                forecastHTML += `
                    <div class="forecast-card">
                        <div class="forecast-day">${day}</div>
                        <div class="forecast-icon">${icon}</div>
                        <div class="forecast-temp">${maxTemp}°C</div>
                        <div class="forecast-temp-min">${minTemp}°C</div>
                    </div>
                `;
            });
            
            forecastHTML += '</div></div>';
            forecastContainer.innerHTML = forecastHTML;
        }

        function addToRecentCities(city, country) {
            const cityName = `${city}, ${country}`;
            
            // Remove if already exists
            currentCities = currentCities.filter(c => c !== cityName);
            
            // Add to beginning
            currentCities.unshift(cityName);
            
            // Keep only 5 recent cities
            currentCities = currentCities.slice(0, 5);
        }

        function searchWeather() {
            const cityInput = document.getElementById('cityInput');
            const city = cityInput.value.trim();
            
            if (!city) {
                showError('Please enter a city name');
                return;
            }
            
            fetchWeather(city);
            cityInput.value = '';
        }

        // Allow Enter key to search
        document.getElementById('cityInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchWeather();
            }
        });

        // Load default city on page load
        window.addEventListener('load', () => {
            fetchWeather('New York');
        });
    </script>
</body>
</html>
