<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&amp;display=swap" rel="stylesheet">
  <script src="./image-slot.js"></script>
  <style>
    @keyframes logoShine{0%{transform:translateX(-120%) rotate(20deg)}100%{transform:translateX(120%) rotate(20deg)}}
  </style>
</helmet>
<div style="width: 100%; height: 100%; min-height: 480px; display: flex; align-items: center; justify-content: center; background: {{ pageBg }}; padding: 40px; position: relative">
  <div style="position:relative;width:280px;height:280px;border-radius:50%;background:{{ ringGradient }};padding:8px;box-shadow:0 18px 40px -12px rgba(0,0,0,0.45), 0 4px 10px rgba(0,0,0,0.25)">
    <div style="position:relative;width:100%;height:100%;border-radius:50%;background:{{ faceGradient }};display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;border:2px solid {{ accentColor }}">

      <sc-if value="{{ usePhoto }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;top:24px;left:24px;right:24px;bottom:78px;border-radius:50%;overflow:hidden;border:3px solid {{ accentColor }};box-shadow:0 6px 16px rgba(0,0,0,0.35)">
          <image-slot id="logo-key-photo" shape="circle" placeholder="Drop a key/lock photo" credit="{{ photoCredit }}" credit-href="{{ photoCreditHref }}" src="{{ photoSrc }}"></image-slot>
        </div>
      </sc-if>

      <sc-if value="{{ showIcon }}" hint-placeholder-val="{{ true }}">
        
      </sc-if>

      <div style="margin-top:{{ textMarginTop }};display:flex;flex-direction:column;align-items:center;text-align:center;line-height:1.3">
        <div style="font-family:'Inter',sans-serif;font-weight:900;font-size:40px;letter-spacing:1px;color:{{ textColor }};text-transform:none">{{ mainText }}</div>
        <div style="font-family:'Inter',sans-serif;font-weight:700;font-size:16px;letter-spacing:3.5px;color:{{ accentColorLight }};margin-top:4px;text-transform:none">{{ subText }}</div>
      </div>

      
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 400, &quot;height&quot;: 480},
  &quot;usePhoto&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Style&quot;},
  &quot;accentColor&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#a8760a&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;#a8760a&quot;, &quot;#c9a24b&quot;, &quot;#b5442e&quot;, &quot;#3f6b4f&quot;], &quot;section&quot;: &quot;Colors&quot;},
  &quot;bgColor&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#20242c&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;#20242c&quot;, &quot;#1c1c1c&quot;, &quot;#1e2e26&quot;, &quot;#2b2320&quot;], &quot;section&quot;: &quot;Colors&quot;},
  &quot;mainText&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;585&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Text&quot;},
  &quot;subText&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;LOCKSMITH&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Text&quot;}
}">
class Component extends DCLogic {
  renderVals() {
    const accentColor = this.props.accentColor ?? '#a8760a';
    const bgColor = this.props.bgColor ?? '#20242c';
    const mainText = this.props.mainText ?? '   585';
    const subText = this.props.subText ?? 'LOCKSMITH';
    const usePhoto = this.props.usePhoto ?? false;
    const photoSrc = this.props.photoSrc ?? '';
    const photoCredit = this.props.photoCredit ?? '';
    const photoCreditHref = this.props.photoCreditHref ?? '';

    return {
      accentColor,
      accentColorLight: this.lighten(accentColor, 22),
      bgColor,
      pageBg: this.props.pageBg ?? '#f2ead9',
      faceGradient: `radial-gradient(circle at 35% 28%, ${this.lighten(bgColor, 10)} 0%, ${bgColor} 65%, ${this.darken(bgColor, 12)} 100%)`,
      ringGradient: `linear-gradient(135deg, ${this.lighten(accentColor, 18)}, ${accentColor} 45%, ${this.darken(accentColor, 15)})`,
      faceColorSolid: bgColor,
      textColor: '#faf7f0',
      mainText,
      subText,
      usePhoto,
      showIcon: !usePhoto,
      textMarginTop: usePhoto ? '10px' : '14px',
      photoSrc,
      photoCredit,
      photoCreditHref
    };
  }

  hexToRgb(hex) {
    const h = hex.replace('#', '');
    const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
    const num = parseInt(full, 16);
    return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
  }
  clamp(v) { return Math.max(0, Math.min(255, v)); }
  lighten(hex, pct) {
    const { r, g, b } = this.hexToRgb(hex);
    const amt = Math.round(2.55 * pct);
    return `rgb(${this.clamp(r + amt)},${this.clamp(g + amt)},${this.clamp(b + amt)})`;
  }
  darken(hex, pct) {
    const { r, g, b } = this.hexToRgb(hex);
    const amt = Math.round(2.55 * pct);
    return `rgb(${this.clamp(r - amt)},${this.clamp(g - amt)},${this.clamp(b - amt)})`;
  }
}
</script>
</body>
</html>
